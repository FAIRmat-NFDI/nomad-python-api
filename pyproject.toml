[project]
name = "nomad-python-api"
version = "0.1.0.dev0"
description = "Python SDK for core NOMAD operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<0.29"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomad_python_api"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/src", "/tests"]

[dependency-groups]
dev = ["pytest>=9.2,<10"]
docs = ["mkdocs>=1.6.1,<2", "mkdocs-material>=9.8.2,<10"]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }

[tool.pytest.ini_options]
addopts = '-m "not integration"'
markers = [
    "integration: read-only tests against a live NOMAD deployment",
    "snippet: runnable code included in the user guide",
]
