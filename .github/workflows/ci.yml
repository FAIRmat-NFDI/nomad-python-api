name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          require-checksums: true
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --offline --no-sync python -m pytest tests/unit tests/snippets
      - run: uv build
      - name: Install and import the wheel offline
        run: |
          uv export --locked --no-default-groups --no-emit-project -o "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --no-project --python "$UV_PYTHON" --with pip python -m pip download \
            --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/runtime-requirements.txt" \
            -d "$RUNNER_TEMP/wheelhouse"
          uv venv --offline "$RUNNER_TEMP/wheel-smoke"
          smoke_python="$RUNNER_TEMP/wheel-smoke/bin/python"
          uv pip install --offline --no-index --find-links "$RUNNER_TEMP/wheelhouse" --python "$smoke_python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_python" -I -c 'from nomad_python_api import NomadClient, Scope; from nomad_python_api.identity import BearerTokenCredential; assert Scope.USERS_READ.value == "users:read"'
      - name: Upload the tested distributions
        if: github.event_name == 'push' && !github.event.deleted && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check pull request source branch
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            if [[ "$HEAD_BRANCH" != develop || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::Open release pull requests from this repository's develop branch."
              exit 1
            fi
          elif [[ "$HEAD_BRANCH" != dev/?* ]]; then
            echo "::error::Open pull requests to develop from a dev/<name> branch."
            exit 1
          fi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          require-checksums: true
          enable-cache: false
      - run: uv sync --locked --only-group docs
      - name: Check release version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:pyproject.toml" | uv run --no-sync python -c '
          import sys
          import tomllib
          from packaging.version import Version

          previous = Version(tomllib.loads(sys.stdin.read())["project"]["version"])
          with open("pyproject.toml", "rb") as project:
              current = Version(tomllib.load(project)["project"]["version"])
          if current <= previous:
              sys.exit(f"Bump the package version before merging to main (currently {previous}).")
          '
      - run: uv run --no-sync mkdocs build --strict -f mkdocs.yml
      - run: uv run --no-sync mkdocs build --strict -f mkdocs.public.yml
      - name: Check built docs assets
        run: |
          uv run --no-sync python docs/theme/check_site_assets.py \
            site/combined/index.html site/combined/dev/oasis/index.html \
            site/user/index.html site/user/identity/rest.html
      - name: Upload the user guide for GitHub Pages
        if: github.event_name == 'push' && !github.event.deleted && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/user

  live:
    name: Live NOMAD test
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !github.event.deleted)) &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nomad-test
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          require-checksums: true
          enable-cache: false
      - run: uv sync --locked
      - name: Check the configured NOMAD account endpoint
        env:
          NOMAD_TEST_API_URL: ${{ vars.NOMAD_TEST_API_URL }}
          NOMAD_TEST_PAT: ${{ secrets.NOMAD_TEST_PAT }}
        run: uv run --no-sync python -m pytest -m integration tests/integration

  publish-docs:
    if: github.event_name == 'push' && !github.event.deleted && github.ref == 'refs/heads/develop'
    needs: [package, docs, live]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish-pypi:
    if: github.event_name == 'push' && !github.event.deleted && github.ref == 'refs/heads/main'
    needs: [package, docs, live]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
